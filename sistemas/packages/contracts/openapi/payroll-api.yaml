openapi: 3.1.0
info:
  title: Payroll Export BFF API
  version: 1.0.0
  license:
    name: POC use only
security: []
servers:
  - url: http://localhost:8080
paths:
  /api/v1/employees:
    get:
      summary: List eligible employees
      operationId: listEmployees
      parameters:
        - $ref: '#/components/parameters/StartPeriod'
        - $ref: '#/components/parameters/EndPeriod'
        - $ref: '#/components/parameters/PaymentTypes'
      responses:
        '200': { description: Eligible employees }
  /api/v1/employees/{employeeId}/payments:
    get:
      summary: List employee payments
      operationId: listPayments
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: integer, format: int64 } }
        - $ref: '#/components/parameters/StartPeriod'
        - $ref: '#/components/parameters/EndPeriod'
      responses:
        '200': { description: Payments }
  /api/v1/exports:
    post:
      summary: Request an asynchronous export
      operationId: requestExport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportRequest' }
      responses:
        '202':
          description: Published to Kafka
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedExport' }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      summary: Search export history
      operationId: searchExports
      parameters:
        - { name: requestId, in: query, schema: { type: string, format: uuid } }
        - { name: employeeId, in: query, schema: { type: integer, format: int64 } }
        - $ref: '#/components/parameters/StartPeriod'
        - $ref: '#/components/parameters/EndPeriod'
        - $ref: '#/components/parameters/PaymentTypes'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ExportStatus' } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Export history }
  /api/v1/exports/{requestId}:
    get:
      summary: Get one export status
      operationId: getExport
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200': { description: Export status }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/exports/{requestId}/documents:
    get:
      summary: List export documents
      operationId: listDocuments
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200': { description: Documents }
  /api/v1/documents/{documentId}/download:
    get:
      summary: Download a generated PDF
      operationId: downloadDocument
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: PDF stream
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    RequestId: { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
    StartPeriod: { name: startPeriod, in: query, required: true, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' } }
    EndPeriod: { name: endPeriod, in: query, required: true, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' } }
    PaymentTypes: { name: paymentTypes, in: query, required: true, schema: { type: array, items: { $ref: '#/components/schemas/PaymentType' } }, style: form, explode: false }
  schemas:
    PaymentType: { type: string, enum: [SALARY, BENEFIT] }
    ExportStatus: { type: string, enum: [PENDING, PROCESSING, COMPLETED, PARTIAL, FAILED] }
    ExportRequest:
      type: object
      required: [employeeIds, startPeriod, endPeriod, paymentTypes]
      properties:
        employeeIds: { type: array, minItems: 1, uniqueItems: true, items: { type: integer, format: int64 } }
        startPeriod: { type: string }
        endPeriod: { type: string }
        paymentTypes: { type: array, minItems: 1, uniqueItems: true, items: { $ref: '#/components/schemas/PaymentType' } }
    AcceptedExport:
      type: object
      required: [requestId, status, statusUrl]
      properties:
        requestId: { type: string, format: uuid }
        status: { type: string, const: ACCEPTED }
        statusUrl: { type: string }
  responses:
    Problem:
      description: Problem details
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
