server:
  port: ${QUERY_API_PORT:8082}
management.endpoints.web.exposure.include: health
spring:
  application.name: query-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/payroll}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
payroll.storage:
  connection-string: ${AZURITE_CONNECTION_STRING:UseDevelopmentStorage=true}
  container: ${AZURITE_CONTAINER:payroll-documents}
