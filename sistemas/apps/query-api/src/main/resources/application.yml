server:
  port: ${QUERY_API_PORT:8082}
management.endpoints.web.exposure.include: health
spring:
  application.name: query-api
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/payroll?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:payroll}
    password: ${DB_PASSWORD:payroll}
  flyway:
    enabled: true
    locations: classpath:db/migration
payroll.storage:
  connection-string: ${AZURITE_CONNECTION_STRING:UseDevelopmentStorage=true}
  container: ${AZURITE_CONTAINER:payroll-documents}
