server:
  port: ${WORKER_PORT:8083}
management.endpoints.web.exposure.include: health
spring:
  application.name: batch-worker
  batch.job.enabled: false
  batch.jdbc.initialize-schema: never
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/payroll}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
