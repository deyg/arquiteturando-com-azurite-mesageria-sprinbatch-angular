server:
  port: ${WORKER_PORT:8083}
management:
  endpoints.web.exposure.include: health,metrics,prometheus
  metrics:
    tags.application: ${spring.application.name:batch-worker}
    distribution.percentiles-histogram:
      payroll.batch.pdf.duration: true
      payroll.batch.blob.duration: true
      payroll.batch.job.duration: true
      payroll.batch.step.duration: true
spring:
  application.name: batch-worker
  batch.job.enabled: false
  batch.jdbc.initialize-schema: never
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/payroll}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    consumer:
      group-id: payroll-batch-worker
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    listener.ack-mode: manual_immediate
payroll.storage:
  connection-string: ${AZURITE_CONNECTION_STRING:UseDevelopmentStorage=true}
  container: ${AZURITE_CONTAINER:payroll-documents}
payroll.kafka.topic: ${PAYROLL_EXPORT_TOPIC:payroll.exports.requested.v1}
payroll.pdf-motor.url: ${PDF_MOTOR_URL:http://127.0.0.1:8084}
